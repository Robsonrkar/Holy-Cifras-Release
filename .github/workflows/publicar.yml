# Cria a release pública quando uma nova versão é enviada para a branch "staging" (release.json + HolyCifras.exe,
# ou, quando o exe passa de 100 MB (limite do git), HolyCifras.exe.parte-00, -01, ... que são juntadas aqui).
# O Holy Cifras lê "releases/latest" deste repositório para avisar e baixar atualizações.
name: Publicar release
on:
  push:
    branches: [staging]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(jq -r .version release.json)
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versão inválida: $VER"; exit 1; }
          WANT=$(jq -r .sha256 release.json)
          if ls HolyCifras.exe.parte-* >/dev/null 2>&1; then
            cat $(ls HolyCifras.exe.parte-* | sort) > HolyCifras.exe
            rm -f HolyCifras.exe.parte-*
          fi
          [ -f HolyCifras.exe ] || { echo "falta o HolyCifras.exe (ou as partes)"; exit 1; }
          GOT=$(sha256sum HolyCifras.exe | cut -d' ' -f1)
          [ "$WANT" = "$GOT" ] || { echo "SHA-256 não confere ($WANT x $GOT)"; exit 1; }
          jq -r .notes release.json > notes.md
          printf '\n\nSHA-256: %s\n' "$GOT" >> notes.md
          if gh release view "v$VER" >/dev/null 2>&1; then gh release delete "v$VER" --yes --cleanup-tag; fi
          gh release create "v$VER" HolyCifras.exe --title "Holy Cifras $VER" --notes-file notes.md --target "$GITHUB_SHA" --latest
